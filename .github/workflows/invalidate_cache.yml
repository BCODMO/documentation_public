# This is a basic workflow to help you get started with Actions

name: invalidate_cache

env:
  REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
  VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
  STAGING_URL: ${{ vars.STAGING_URL }}
  PROD_URL: ${{ vars.PROD_URL }}


# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "resetcache"
  resetcache:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Reset cache in prod
        run: >
          curl --header "x-bcodmo-revalidate-token: $REVALIDATE_TOKEN"
          --header "x-vercel-protection-bypass: $VERCEL_BYPASS"
          $PROD_URL/api/revalidate?tag=gitbook
          
      - name: Reset cache in staging
        run: >
          curl --header "x-bcodmo-revalidate-token: $REVALIDATE_TOKEN"
          --header "x-vercel-protection-bypass: $VERCEL_BYPASS"
          $STAGING_URL/api/revalidate?tag=gitbook

